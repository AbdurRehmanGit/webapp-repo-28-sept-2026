<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motivation Quote</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Georgia, "Times New Roman", serif;
        background: #111827;
        color: #f8fafc;
        padding: 24px;
      }

      blockquote {
        margin: 0;
        max-width: 40rem;
        text-align: center;
      }

      /* Edit the quote text in the <p> below */
      p {
        margin: 0;
        font-size: 2rem;
        line-height: 1.4;
      }

      footer {
        margin-top: 1.25rem;
        font-size: 1rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <blockquote>
      <p>Jo Pani sy nahaye ga wo libas badly ga</p>
      <p>Jo Pani sy nahaye ga wo libas badly ga</p>
      <p>Jo Paseeny sy naye ga wo itihas badly ga</p>
      <footer>— Chota Khan Sir</footer>
    </blockquote>
    <blockquote>
      <p>The only way to do great work is to love what you do.</p>
      <footer>— Steve Jobs</footer>
    </blockquote>
  </body>
</html>
